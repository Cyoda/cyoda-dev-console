version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    target-branch: staging
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    # Matches pnpm's `minimumReleaseAge` (14 days, pnpm-workspace.yaml). Without
    # it Dependabot proposes releases pnpm then refuses to resolve. Cooldown
    # applies to version updates only — security updates are never delayed.
    cooldown:
      default-days: 14
    groups:
      npm-minor-patch:
        update-types:
          - minor
          - patch
      # Group majors too so they arrive as one review-me PR per ecosystem
      # instead of one PR per dependency.
      npm-major:
        update-types:
          - major
    ignore:
      # Hand-pinned lockstep deps — bumped manually, not by Dependabot.
      - dependency-name: "@cyoda/workflow-*"
      # Peer of @cyoda/workflow-monaco, which declares `>=0.45 <0.56`, and 0.57
      # also removed the editor.worker import path the dev-console build uses.
      # Drop this once a workflow-monaco release accepts monaco-editor >= 0.56.
      - dependency-name: "monaco-editor"
      # TypeScript 7 is blocked by @typescript-eslint/parser, whose peer range
      # is `>=4.8.4 <6.1.0`. Drop this once typescript-eslint supports TS 7, and
      # move together with ../cyoda-workflow-editor, which shares the tooling.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: cargo
    directory: "/apps/dev-console/src-tauri"
    target-branch: staging
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    # Same 14-day supply-chain cooldown as npm (see above).
    cooldown:
      default-days: 14
    groups:
      # notify-debouncer-full re-exports `notify`, so the two must upgrade in
      # lockstep — even across majors. Bumping one alone puts two notify
      # versions in the tree and the file watcher fails to compile. Listed
      # first so these always group together regardless of bump type.
      notify:
        patterns:
          - "notify"
          - "notify-debouncer-full"
      cargo-minor-patch:
        update-types:
          - minor
          - patch
      cargo-major:
        update-types:
          - major

  - package-ecosystem: github-actions
    directory: "/"
    target-branch: staging
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    # Same 14-day supply-chain cooldown as npm (see above).
    cooldown:
      default-days: 14
    groups:
      actions-minor-patch:
        update-types:
          - minor
          - patch
      actions-major:
        update-types:
          - major
