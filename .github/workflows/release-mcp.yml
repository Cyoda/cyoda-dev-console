name: Release MCP
on:
  push:
    tags: ["mcp-v*.*.*"]
  workflow_dispatch: {}   # build + pack rehearsal; never publishes

concurrency:
  group: release-mcp-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write         # lets npm mint the provenance attestation

jobs:
  guard:
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      # Pass the ref via env, not `${{ }}` inlined into the shell: a crafted tag
      # (git tags may contain shell metacharacters and still match mcp-v*.*.*)
      # would otherwise be injected into the run command. GitHub-recommended.
      - env:
          TAG: ${{ github.ref_name }}
        run: ./scripts/check-mcp-release-version.sh "$TAG" apps/model-editor-mcp/package.json

  build-and-publish:
    needs: [guard]
    if: ${{ always() && (github.event_name == 'workflow_dispatch' || needs.guard.result == 'success') }}
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org   # writes the .npmrc that reads NODE_AUTH_TOKEN
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter './packages/*' build        # workspace deps first — esbuild resolves their dist/
      - run: pnpm --filter @cyoda/model-editor-mcp build

      - name: Rehearse (pack + assert) — dispatch only, never publishes
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: ./scripts/check-mcp-pack.sh

      # pnpm packs, npm publishes. Each does the half the other can't:
      #
      # - `pnpm pack` rewrites the pnpm-only specifiers in the manifest
      #   (`workspace:*` on the four internal packages, `catalog:` on 15 devDeps)
      #   into real versions. npm doesn't understand either, so packing with npm
      #   would publish those literals.
      # - `npm publish --provenance` mints the SLSA attestation. pnpm 9 got this
      #   for free by shelling out to npm, which honoured `publishConfig.provenance`;
      #   pnpm 10+ publishes natively, ignores that field, and exposes no flag of its
      #   own — which is how 0.2.0 shipped unattested.
      - name: Publish to npm — tag push only
        if: ${{ github.event_name == 'push' }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          version="$(jq -r .version apps/model-editor-mcp/package.json)"
          case "$version" in
            *-*) dist_tag=next ;;    # prerelease -> next
            *)   dist_tag=latest ;;  # stable -> latest
          esac
          out="$(mktemp -d)"
          pnpm --filter @cyoda/model-editor-mcp pack --pack-destination "$out"
          tgz="$(ls "$out"/*.tgz)"
          echo "publishing ${version} (${tgz##*/}) to dist-tag '${dist_tag}'"
          npm publish "$tgz" --provenance --tag "$dist_tag"

      # npm exits 0 when provenance was requested but not attached, so assert it
      # rather than discovering another unattested release on the registry later.
      #
      # The registry takes minutes, not seconds, to expose a fresh version: the
      # 0.3.0 publish was attested but invisible for ~5 min, so a 60 s window
      # failed this step after a good publish and skipped github-release. Poll
      # for up to 10 min, bypassing npm's local cache on every attempt.
      - name: Assert the release is attested — tag push only
        if: ${{ github.event_name == 'push' }}
        timeout-minutes: 12
        run: |
          set -euo pipefail
          version="$(jq -r .version apps/model-editor-mcp/package.json)"
          attempts=30
          for i in $(seq 1 "$attempts"); do
            if npm view "@cyoda/model-editor-mcp@${version}" dist.attestations.url --prefer-online 2>/dev/null | grep -q .; then
              echo "provenance-ok: ${version}"
              exit 0
            fi
            echo "attestation not visible yet (attempt ${i}/${attempts}) — retrying in 20s"
            sleep 20
          done
          echo "::error::published ${version} but no provenance attestation is registered"
          exit 1

  # Surface the npm release on the repo's Releases page (npm publish alone
  # leaves only a git tag). Runs after a successful publish, tag pushes only.
  github-release:
    needs: [build-and-publish]
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Create GitHub Release for the MCP tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="$(jq -r .version apps/model-editor-mcp/package.json)"
          case "$version" in
            *-*) pre=(--prerelease); dist_tag=next ;;   # prerelease -> next
            *)   pre=();             dist_tag=latest ;;  # stable -> latest
          esac
          notes="Published to npm as \`@cyoda/model-editor-mcp@${version}\` (dist-tag \`${dist_tag}\`)."
          notes="${notes} Install: \`npm install -g @cyoda/model-editor-mcp@${version}\`."
          notes="${notes} https://www.npmjs.com/package/@cyoda/model-editor-mcp/v/${version}"
          gh release create "$TAG" \
            --repo "${{ github.repository }}" \
            --title "model-editor-mcp $version" \
            --notes "$notes" \
            "${pre[@]}"
