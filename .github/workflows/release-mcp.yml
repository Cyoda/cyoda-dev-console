name: Release MCP
on:
  push:
    tags: ["mcp-v*.*.*"]
  workflow_dispatch: {}   # build + pack rehearsal; never publishes

concurrency:
  group: release-mcp-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  # npm trusted publishing: GitHub mints an OIDC token that npm swaps for a
  # short-lived publish credential, and the same token signs the provenance
  # attestation. No npm token is stored anywhere.
  id-token: write

jobs:
  guard:
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      # Pass the ref via env, not `${{ }}` inlined into the shell: a crafted tag
      # (git tags may contain shell metacharacters and still match mcp-v*.*.*)
      # would otherwise be injected into the run command. GitHub-recommended.
      - env:
          TAG: ${{ github.ref_name }}
        run: ./scripts/check-mcp-release-version.sh "$TAG" apps/model-editor-mcp/package.json

  build-and-publish:
    needs: [guard]
    if: ${{ always() && (github.event_name == 'workflow_dispatch' || needs.guard.result == 'success') }}
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          # No `registry-url`: that would write an .npmrc with a placeholder
          # `_authToken`. Publishing authenticates via npm trusted publishing
          # (OIDC), not a token — see RELEASE.md "model-editor-mcp (npm)".

      # Trusted publishing needs npm >= 11.5.1 and `npm stage publish` a recent
      # 11.x; Node 22 bundles npm 10.x. Exact pin, >= 14 days old (supply-chain
      # cooldown, like pnpm-workspace.yaml) — same version cyoda-workflow-editor
      # releases with.
      - name: Upgrade npm for trusted publishing
        run: npm install -g npm@11.21.2 && npm --version
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter './packages/*' build        # workspace deps first — esbuild resolves their dist/
      - run: pnpm --filter @cyoda/model-editor-mcp build

      - name: Rehearse (pack + assert) — dispatch only, never publishes
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: ./scripts/check-mcp-pack.sh

      # pnpm packs, npm stages. Each does the half the other can't:
      #
      # - `pnpm pack` rewrites the pnpm-only specifiers in the manifest
      #   (`workspace:*` on the four internal packages, `catalog:` on 15 devDeps)
      #   into real versions. npm doesn't understand either, so packing with npm
      #   would publish those literals.
      # - `npm stage publish --provenance` authenticates via OIDC trusted
      #   publishing and mints the SLSA attestation. The package's trusted
      #   publisher on npmjs.com has "Allow npm publish" UNCHECKED, so a plain
      #   `npm publish` is refused (`E403 OIDC permission denied for this
      #   action`): CI can only *stage* a version, and it stays invisible until a
      #   maintainer approves it with 2FA. A compromised workflow therefore can't
      #   put a version live on its own.
      #
      # The attestation check and moving `next` to a new stable version can't
      # run here — a staged version isn't visible until approved, and the trusted
      # publisher doesn't allow `npm dist-tag` either. Both happen after approval
      # via scripts/mcp-post-approval.sh (RELEASE.md).
      - name: Stage on npm (awaits maintainer approval) — tag push only
        if: ${{ github.event_name == 'push' }}
        run: |
          set -euo pipefail
          version="$(jq -r .version apps/model-editor-mcp/package.json)"
          case "$version" in
            *-*) dist_tag=next ;;    # prerelease -> next
            *)   dist_tag=latest ;;  # stable -> latest
          esac
          out="$(mktemp -d)"
          pnpm --filter @cyoda/model-editor-mcp pack --pack-destination "$out"
          tgz="$(ls "$out"/*.tgz)"
          echo "staging ${version} (${tgz##*/}) with dist-tag '${dist_tag}'"
          # Run from the tarball's directory so npm doesn't apply the
          # workspace root's context.
          cd "$out"
          set +e
          log="$(npm stage publish "./${tgz##*/}" --tag "$dist_tag" --access public --provenance 2>&1)"
          rc=$?
          set -e
          printf '%s\n' "$log"
          if [ "$rc" -ne 0 ]; then
            # Re-running a failed workflow: a staged-but-unapproved version
            # can't be seen by `npm view`, so the only signal it's already
            # there is the registry rejecting the duplicate.
            if printf '%s' "$log" | grep -Eqi 'E409|EPUBLISHCONFLICT|cannot publish over|already (been )?(staged|published|exists)'; then
              echo "::notice::${version} is already staged or published; treating as staged"
            else
              exit "$rc"
            fi
          fi
          echo "::notice::@cyoda/model-editor-mcp@${version} is STAGED, not live. Approve it on npmjs.com (or 'npm stage approve'), then run scripts/mcp-post-approval.sh ${version}"

  # Surface the npm release on the repo's Releases page (npm alone leaves only
  # a git tag). Runs once the version is staged — i.e. before npm approval, as
  # in cyoda-workflow-editor. If the staged version is rejected instead, delete
  # this release and its tag.
  github-release:
    needs: [build-and-publish]
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Create GitHub Release for the MCP tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="$(jq -r .version apps/model-editor-mcp/package.json)"
          case "$version" in
            *-*) pre=(--prerelease); dist_tag=next ;;   # prerelease -> next
            *)   pre=();             dist_tag=latest ;;  # stable -> latest
          esac
          notes="Published to npm as \`@cyoda/model-editor-mcp@${version}\` (dist-tag \`${dist_tag}\`)."
          notes="${notes} Install: \`npm install -g @cyoda/model-editor-mcp@${version}\`."
          notes="${notes} https://www.npmjs.com/package/@cyoda/model-editor-mcp/v/${version}"
          # --latest=false: the repo's "Latest" release belongs to the desktop
          # app — the Linux installer is fetched from
          # releases/latest/download/install.sh, which an MCP release lacks.
          gh release create "$TAG" \
            --repo "${{ github.repository }}" \
            --title "model-editor-mcp $version" \
            --notes "$notes" \
            --latest=false \
            "${pre[@]}"
