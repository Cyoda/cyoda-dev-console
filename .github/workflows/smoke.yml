name: Smoke
on:
  push:
    branches: [staging]
jobs:
  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: pnpm }
      - uses: dtolnay/rust-toolchain@stable
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter './packages/*' build
      # Bundles are pinned by tauri.conf.json `bundle.targets` (dmg on macOS).
      # Do NOT pass `-- --bundles X`: the `--` shunts it to cargo, which rejects it.
      - run: pnpm --filter dev-console tauri:build
  linux:
    runs-on: ubuntu-22.04
    env:
      APPIMAGE_EXTRACT_AND_RUN: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: pnpm }
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux bundle dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter './packages/*' build
      # Bundles are pinned by tauri.conf.json `bundle.targets` (appimage on Linux).
      # Do NOT pass `-- --bundles X`: the `--` shunts it to cargo, which rejects it.
      - run: pnpm --filter dev-console tauri:build
  mcp:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter './packages/*' build
      - run: pnpm --filter @cyoda/model-editor-mcp build
      - run: ./scripts/check-mcp-pack.sh
