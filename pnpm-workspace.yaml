packages:
  - "apps/*"
  - "packages/*"

# Only these packages may run install lifecycle scripts; pnpm blocks all others.
allowBuilds:
  esbuild: true

# Transitive-dependency version pins. These live here rather than in
# package.json's `pnpm.overrides` because pnpm 11 no longer reads that field —
# it is silently ignored, which would quietly un-patch the advisories below.
# Each targets the advisory's FIRST PATCHED version, which is also what keeps
# them resolvable under the `minimumReleaseAge` cooldown further down.
overrides:
  # GHSA-3jxr-9vmj-r5cp (high) — DoS via exponential-time expansion of
  # consecutive non-expanding {} groups. Two disjoint vulnerable lines, both
  # dev-only: 1.x via eslint-plugin-react -> minimatch@^3, 5.x via eslint 10 /
  # typescript-eslint -> minimatch@10. Drop these once eslint-plugin-react
  # ships a release off minimatch@^3 (7.37.5 is still the latest).
  "brace-expansion@<1.1.16": "1.1.16"
  "brace-expansion@>=3.0.0 <5.0.7": "5.0.7"
  # GHSA-c2j3-45gr-mqc4 (low) — CUSTOM_ELEMENT_HANDLING bypasses
  # afterSanitizeElements. Reaches the shipped bundles via monaco-editor, which
  # pins dompurify exactly (0.55.1 -> 3.2.7). No monaco release fixes it: 0.56.0
  # still pins 3.4.8 and is outside workflow-monaco's peer range anyway.
  "dompurify@<3.4.12": "3.4.12"

# Supply-chain hardening: no release younger than 14 days (14*24*60 minutes)
# enters the lockfile, so a compromised publish has time to be caught and
# yanked before we resolve it. Mirrors ../cyoda-workflow-editor.
minimumReleaseAge: 20160
minimumReleaseAgeExclude:
  # Our own packages are exempt on purpose — adopting a @cyoda/workflow-* release
  # the day it ships is the normal workflow here, and the cooldown would block it.
  - "@cyoda/*"
# Shared dependency catalog for this repo's own workspace members — the internal
# `packages/*` and both apps resolve their `catalog:` specifiers from here.
#
# It tracks ../cyoda-workflow-editor/pnpm-workspace.yaml but is NOT a mirror and
# need not match entry-for-entry. The @cyoda/workflow-* packages come from public
# npm with their own deps already resolved, so this catalog governs only our
# resolutions. This repo may lead the editor repo on shared dev tooling (it
# currently does) — never downgrade an entry here just to match it.
#
# What alignment does buy: `react`, `react-dom`, `reactflow` and `monaco-editor`
# are PEER dependencies of @cyoda/workflow-react / -viewer / -monaco, satisfied
# from this catalog. Keep those four inside the published peer ranges when
# bumping. `monaco-editor` is the tight one — workflow-monaco declares
# `>=0.45 <0.56`, so 0.55.1 sits just under the ceiling and going to 0.56 needs a
# workflow-monaco release first.
catalog:
  "@changesets/cli": 3.0.3
  "@playwright/test": 1.61.1
  "@testing-library/dom": 10.4.1
  "@testing-library/react": 16.3.2
  "@types/node": 26.1.0
  "@types/react": 19.2.17
  "@types/react-dom": 19.2.3
  "@eslint/js": 10.0.1
  "@typescript-eslint/eslint-plugin": 8.62.1
  "@typescript-eslint/parser": 8.62.1
  "@vitejs/plugin-react": 6.0.3
  "@vitest/coverage-v8": 5.0.1
  eslint: 10.6.0
  fast-check: 4.8.0
  elkjs: 0.11.1
  immer: 11.1.9
  jsdom: 30.1.1
  jsonc-parser: 3.3.1
  monaco-editor: 0.55.1
  prettier: 3.9.4
  typescript-eslint: 8.62.1
  react: 19.2.7
  react-dom: 19.2.7
  reactflow: 11.11.4
  tsup: 8.5.1
  typescript: 7.0.2
  uuid: 14.0.1
  vite: 8.1.2
  vitest: 4.1.9
  zod: 4.4.3
